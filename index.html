<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천문탑의 밤 — 학생용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080C1C;
  --bg-2:#0E1430;
  --panel:rgba(20,28,58,.78);
  --panel-2:rgba(32,43,82,.78);
  --line:#36446F;
  --line-soft:#2A3558;
  --gold:#F2CB6B;
  --gold-dim:#D9AE4C;
  --gold-lt:#F2CB6B;
  --ember:#FF9A5B;
  --cream:#F4EEDD;
  --ink:#F4EEDD;
  --muted:#A9B6DC;
  --muted-d:#A9B6DC;
  --night:#060A18;
  --gry:#E0574A; --sly:#3FBE83; --rav:#7E9BFF; --huf:#F2C247;
  --r-sm:8px; --r-md:14px; --r-lg:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:
    radial-gradient(900px 560px at 78% 6%, rgba(104,78,186,.32), transparent 64%),
    radial-gradient(780px 500px at 14% 24%, rgba(34,92,170,.28), transparent 66%),
    radial-gradient(1200px 640px at 50% 112%, rgba(242,203,107,.12), transparent 70%),
    linear-gradient(180deg,#080C1C 0%,#0C1228 46%,#090E20 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Gowun Batang", serif;
  font-size:17px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;line-height:1.25;font-weight:700}
.en{font-family:"Cinzel",serif;letter-spacing:.1em}
.deco{font-family:"Cinzel Decorative",serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 90px;position:relative}
.narrow{max-width:580px;margin:0 auto}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hidden{display:none !important}
.center{text-align:center}
svg{display:block}

/* 상단 촛불 띠 */
.candlerow{height:56px;display:flex;justify-content:center;gap:38px;align-items:flex-end;
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg, rgba(214,165,58,.10), transparent);}
.candlerow svg{width:22px;height:52px}
.flame{transform-origin:center bottom;animation:flick 2.6s ease-in-out infinite}
.candlerow svg:nth-child(2) .flame{animation-delay:-.7s}
.candlerow svg:nth-child(3) .flame{animation-delay:-1.4s}
.candlerow svg:nth-child(4) .flame{animation-delay:-2s}
.candlerow svg:nth-child(5) .flame{animation-delay:-1.1s}
@keyframes flick{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(.86) scaleX(1.08)}}

/* 버튼 */
.btn{
  display:block;width:100%;padding:17px 24px;border-radius:var(--r-md);
  background:linear-gradient(180deg,#D8A93F,#A87A1F);
  color:#2A1B08;font-family:"Cinzel",serif;font-weight:700;letter-spacing:.12em;font-size:16px;
  box-shadow:0 6px 0 #7A5613, 0 12px 24px rgba(0,0,0,.45);
  transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7A5613, 0 6px 14px rgba(0,0,0,.4)}
.btn[disabled]{background:#242E4E;color:#68759E;box-shadow:0 6px 0 #18203A;cursor:not-allowed;filter:none}
.btn.sub{background:linear-gradient(180deg,#3A4778,#26305A);color:var(--cream);box-shadow:0 6px 0 #1A2242,0 12px 22px rgba(0,0,0,.5)}
.btn.danger{background:linear-gradient(180deg,#9E4432,#73301F);color:#FBE9DF;box-shadow:0 6px 0 #4E2014,0 12px 22px rgba(0,0,0,.4)}
.btn-ghost{
  display:inline-block;width:auto;padding:9px 18px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);
  font-family:"Cinzel",serif;font-size:12px;letter-spacing:.12em;font-weight:700;
}
.btn-ghost:hover{border-color:var(--gold-dim);color:var(--gold)}

/* 로그인 */
.hero{margin:34px auto 0;max-width:520px}
.hero svg{width:100%;height:auto}
.title{font-size:40px;letter-spacing:.06em;color:var(--gold);margin:22px 0 8px;
  text-shadow:0 0 22px rgba(242,203,107,.65), 0 0 60px rgba(242,203,107,.30)}
.subtitle{color:var(--muted);font-style:italic;margin:0 0 32px}
.card{
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:30px 28px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 18px 44px rgba(0,0,0,.55);
}
.field{margin-bottom:20px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-family:"Cinzel",serif;font-size:11.5px;letter-spacing:.18em;color:var(--gold-dim);margin-bottom:9px}
.field input{
  width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:rgba(8,13,32,.85);font-family:inherit;font-size:18px;color:var(--ink);
}
textarea{
  width:100%;padding:14px 15px;border:1px solid rgba(255,255,255,.26);border-radius:var(--r-sm);
  background:rgba(8,13,32,.9);font-family:inherit;font-size:18px;color:var(--cream);
}
.field input::placeholder{color:#63719E}
.field input:focus{border-color:var(--gold);background:rgba(16,24,54,.95);box-shadow:0 0 0 3px rgba(242,203,107,.16)}
textarea:focus{border-color:var(--gold-lt);background:rgba(14,21,48,.95)}

/* 분류 */
.hatwrap{width:190px;margin:30px auto 4px;position:relative}
.hatwrap svg{width:100%;height:auto}
.ring{position:absolute;inset:-22px;border-radius:50%;border:2px dashed rgba(214,165,58,.35);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hat-body{transform-origin:50% 84%}
.sorting .hat-body{animation:wobble 1.1s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.reveal-crest{width:120px;margin:6px auto 12px}
.house-en{font-family:"Cinzel",serif;font-size:38px;letter-spacing:.08em;margin:4px 0}
.house-ko{color:var(--muted);font-size:19px;margin-bottom:26px}


/* 배경 별하늘 */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;border-radius:50%;background:#FFFFFF;
  animation:skyTw var(--t) ease-in-out infinite}
@keyframes skyTw{0%,100%{opacity:var(--o1);transform:scale(.8)}
  50%{opacity:var(--o2);transform:scale(1.3)}}
.sky i.big{background:#FFF3D0;box-shadow:0 0 8px rgba(255,236,180,.9)}
.skyfall{position:absolute;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,247,220,.95));
  animation:skyFall var(--d) ease-in forwards}
@keyframes skyFall{0%{transform:translate(0,0) rotate(22deg) scaleX(.2);opacity:0}
  14%{opacity:1}100%{transform:translate(64vw,30vh) rotate(22deg) scaleX(1);opacity:0}}
.wrap{position:relative;z-index:1}
.candlerow{position:relative;z-index:1}

/* 글자가 빛나도록 */
.q-title{text-shadow:0 0 16px rgba(244,238,221,.28)}
.hud-house{text-shadow:0 0 20px currentColor}
.cel-title{text-shadow:0 0 24px rgba(242,203,107,.55)}
.quest-head h2{text-shadow:0 0 20px rgba(242,203,107,.45)}
.glass em{text-shadow:0 0 12px rgba(242,203,107,.55)}
.cert-name{text-shadow:none}

/* 완주 배너 */
.banner{background:linear-gradient(180deg,rgba(242,203,107,.20),rgba(242,203,107,.06));
  border:1px solid var(--gold-dim);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:18px;
  display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{color:var(--gold);font-size:18px;text-shadow:0 0 20px rgba(242,203,107,.5)}
.banner p{margin:4px 0 0;color:var(--muted);font-size:14.5px}

/* 마법 가루 */
.dust{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.dp{position:absolute;border-radius:50%;
  background:radial-gradient(circle,#FFF6DC,#C9902B);
  box-shadow:0 0 10px rgba(201,144,43,.85);
  animation:dustFloat var(--d) linear forwards}
@keyframes dustFloat{
  0%{transform:translate(0,0) scale(.25);opacity:0}
  10%{opacity:var(--o,.8)}
  45%{transform:translate(var(--sx),-48vh) scale(1)}
  75%{opacity:var(--o,.8)}
  100%{transform:translate(calc(var(--sx) * -0.55),-108vh) scale(.35);opacity:0}}
.halo{position:absolute;inset:-78px;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle, rgba(255,246,214,.98), rgba(214,165,58,.42) 40%, rgba(214,165,58,0) 68%)}
.halo.burst{animation:haloBurst 1.4s ease-out forwards}
@keyframes haloBurst{0%{opacity:0;transform:scale(.35)}22%{opacity:1}100%{opacity:0;transform:scale(1.55)}}
.hatwrap .hat-body{transition:opacity .85s ease, filter .85s ease}
.hatwrap.veiled .hat-body{opacity:.14;filter:blur(9px)}
.hatwrap.shown .hat-body{animation:hatReveal 1.05s cubic-bezier(.2,1.45,.4,1) both;
  filter:drop-shadow(0 0 16px rgba(214,165,58,.85))}
@keyframes hatReveal{0%{transform:scale(.66);opacity:.15}58%{transform:scale(1.09);opacity:1}100%{transform:none;opacity:1}}
.sorting .aura{opacity:1}

/* 분류 연출 */
.hatwrap{width:210px}
.aura{position:absolute;inset:-46px;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle, rgba(214,165,58,.42), rgba(214,165,58,0) 66%);
  transition:opacity .5s ease}
.sorting .aura{opacity:1;animation:auraPulse 1.15s ease-in-out infinite}
@keyframes auraPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.14);opacity:.95}}
.sorting .ring{animation-duration:2.4s;border-color:rgba(214,165,58,.7)}
.entering .hat-body{animation:hatDrop 1.05s cubic-bezier(.25,1.25,.4,1) both}
@keyframes hatDrop{
  0%{transform:translateY(-78px) rotate(-12deg);opacity:0}
  62%{transform:translateY(8px) rotate(5deg);opacity:1}
  82%{transform:translateY(-3px) rotate(-2deg)}
  100%{transform:none;opacity:1}}
.spark{position:absolute;left:50%;top:56%;border-radius:50%;pointer-events:none;
  background:var(--gold);box-shadow:0 0 8px currentColor;color:var(--gold);
  animation:sparkFly var(--d,1200ms) ease-out forwards}
@keyframes sparkFly{
  0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  18%{opacity:1}
  100%{transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.7);opacity:0}}
.flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 40%, rgba(255,244,214,.95), rgba(255,220,150,0) 58%)}
.flash.go{animation:flashGo .95s ease-out forwards}
@keyframes flashGo{0%{opacity:0;transform:scale(.45)}22%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
.murmur{min-height:30px;margin:0 0 10px;font-style:italic;font-size:16.5px;color:var(--gold-dim);
  opacity:0;transition:opacity .34s ease}
.murmur.on{opacity:1}
.reveal-crest{position:relative;width:130px;margin:8px auto 14px}
.rays{position:absolute;inset:-34px;border-radius:50%;opacity:.42;pointer-events:none;
  background:repeating-conic-gradient(from 0deg, currentColor 0 3.5deg, transparent 3.5deg 17deg);
  -webkit-mask:radial-gradient(circle, transparent 36%, #000 44%, transparent 78%);
  mask:radial-gradient(circle, transparent 36%, #000 44%, transparent 78%);
  animation:spin 16s linear infinite}
.pop{animation:popIn .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popIn{0%{transform:scale(.35) rotate(-12deg);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
.rise{animation:riseIn .55s .14s both}
.rise2{animation:riseIn .55s .3s both}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.house-en{text-shadow:0 0 28px currentColor, 0 0 60px currentColor}

/* 대시보드 HUD */
.hud{
  display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 24px;margin:26px 0 24px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 36px rgba(0,0,0,.5);
}
.hud-left{display:flex;gap:16px;align-items:center}
.hud-crest{width:66px;flex:none}
.hud-name{font-size:13.5px;color:var(--muted);letter-spacing:.05em}
.hud-house{font-family:"Cinzel",serif;font-size:23px;letter-spacing:.06em;font-weight:700}
.hud-pts{font-size:14px;color:var(--muted)}
.glasses{display:flex;gap:13px;align-items:flex-end}
.glass{width:42px;text-align:center}
.tube{height:86px;border:1px solid var(--line);border-top:none;border-radius:0 0 18px 18px;
  background:rgba(6,10,24,.9);display:flex;align-items:flex-end;overflow:hidden;position:relative}
.tube i{display:block;width:100%;transition:height .7s cubic-bezier(.3,.8,.3,1);
  box-shadow:0 -6px 16px currentColor}
.glass b{display:block;font-family:"Cinzel",serif;font-size:10.5px;letter-spacing:.1em;margin-top:6px;color:var(--muted)}
.glass em{display:block;font-style:normal;font-size:13px;font-weight:700;margin-bottom:4px;color:var(--gold)}

/* 과제 카드 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.quest{
  text-align:left;width:100%;border-radius:var(--r-lg);padding:22px 22px 18px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);display:flex;flex-direction:column;gap:9px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 12px 28px rgba(0,0,0,.45);
  transition:border-color .15s ease, transform .1s ease;
}
.quest:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
.quest.locked{background:rgba(255,255,255,.028);border-color:#242E4E;color:#6E7CA8;cursor:not-allowed;
  box-shadow:none;transform:none}
.quest.locked:hover{border-color:#242E4E;transform:none}
.quest.done{border-color:var(--gold-dim)}
.q-top{display:flex;gap:12px;align-items:center}
.q-ico{width:44px;height:44px;flex:none}
.quest.locked .q-ico{opacity:.35}
.q-eyebrow{font-family:"Cinzel",serif;font-size:10.5px;letter-spacing:.18em;color:var(--gold-dim)}
.quest.locked .q-eyebrow{color:#5C6892}
.q-title{font-size:20px}
.q-desc{font-size:14.5px;color:var(--muted);font-style:italic;margin:0}
.quest.locked .q-desc{color:#6E7CA8}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-top:1px solid var(--line-soft);padding-top:12px;margin-top:auto}
.pill{border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 10px;
  font-family:"Cinzel",serif;font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.pill.gold{border-color:var(--gold-dim);color:var(--gold);background:rgba(214,165,58,.1)}

/* 과제 화면 */
.quest-head{display:flex;gap:18px;align-items:center;margin:26px 0 20px}
.quest-head .q-ico{width:64px;height:64px}
.quest-head h2{font-size:27px;color:var(--gold)}
.quest-head p{color:var(--muted);font-style:italic;margin:5px 0 0;font-size:15px}
.obs{
  background:var(--night);border:1px solid #2E3A5E;
  background-image:radial-gradient(rgba(255,255,255,.30) .9px, transparent 1.1px),
                   radial-gradient(rgba(255,255,255,.14) .8px, transparent 1px);
  background-size:44px 44px, 23px 23px;
  background-position:0 0, 11px 17px;
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:26px 24px;margin-bottom:18px;
  box-shadow:inset 0 0 60px rgba(0,0,0,.75);
}
.obs h3{font-family:"Cinzel",serif;font-size:12px;letter-spacing:.2em;color:var(--gold-lt);
  padding-bottom:11px;border-bottom:1px solid rgba(214,165,58,.22);margin-bottom:18px;
  display:flex;align-items:center;gap:9px}
.obs h3 svg{width:17px;height:17px;flex:none}
.ask{font-size:18px;margin:0 0 14px;line-height:1.7}
.hint{font-size:14px;color:var(--muted-d);font-style:italic;margin:-6px 0 14px}
.pairs{display:flex;flex-direction:column;gap:11px}
.pair{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.pair-key{width:150px;text-align:right;flex:none}
.pair-key b{display:block;font-family:"Cinzel",serif;font-size:17px;font-style:italic;color:var(--gold-lt)}
.pair-key span{font-size:13px;color:var(--muted-d)}
.pair input{width:230px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.26);
  background:rgba(8,13,32,.9);font-family:inherit;font-size:17px;color:var(--cream)}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.opts.stack{flex-direction:column;align-items:stretch}
.opts.stack .opt{text-align:left}
.opt{padding:12px 18px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.04);color:var(--cream);font-size:16px}
.opt:hover{background:rgba(220,169,60,.18);border-color:var(--gold-lt)}
.opt.sel{background:linear-gradient(180deg,#F0C55E,#C8922A);color:#2A1B08;border-color:var(--gold-lt);font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.035);text-align:left;width:100%;
  font-size:16px;line-height:1.6;margin-bottom:9px;color:var(--cream)}
.check:hover{background:rgba(220,169,60,.16)}
.check .box{width:21px;height:21px;flex:none;border:1px solid rgba(255,255,255,.72);border-radius:5px;
  margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.check.sel{border-color:var(--gold-lt)}
.check.sel .box{background:var(--gold-lt);border-color:var(--gold-lt);color:#221A16}
.moons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.moonchip{width:104px;padding:13px 6px 11px;border-radius:var(--r-md);position:relative;
  border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.035);color:var(--cream);
  display:flex;flex-direction:column;align-items:center;gap:7px}
.moonchip:hover{background:rgba(220,169,60,.16);border-color:var(--gold-lt)}
.moonchip.sel{border-color:var(--gold-lt);background:rgba(220,169,60,.20)}
.moonchip svg{width:54px;height:54px}
.moonchip span{font-size:14px}
.moonchip .ord{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;
  background:var(--gold-lt);color:#2A1B08;font-family:"Cinzel",serif;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center}
textarea{min-height:118px;resize:vertical;line-height:1.7}

.fb{border-radius:var(--r-md);padding:17px 19px;margin-bottom:16px;font-size:16px;border:1px solid}
.fb.ok{background:rgba(63,190,131,.14);border-color:#3FBE83;color:#BEEED5}
.fb.no{background:rgba(224,120,90,.14);border-color:#E0785A;color:#F8D6C6}
.fb ul{margin:10px 0 0;padding-left:20px}
.fb li{margin-bottom:5px}
.row{display:flex;gap:12px;margin-top:6px}
.row .btn{flex:1}

/* 교사용 */
.prof-btn{position:absolute;top:20px;right:20px;z-index:5}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
th,td{padding:9px 11px;border-bottom:1px solid var(--line-soft);text-align:left}
th{font-family:"Cinzel",serif;font-size:11.5px;letter-spacing:.1em;color:var(--gold-dim)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-style:italic;padding:24px 0}




/* ───────── 단계 축하 ───────── */
.cel{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(16,11,9,.84);opacity:0;pointer-events:none;transition:opacity .35s ease}
.cel.on{opacity:1;pointer-events:auto}
.cel-card{position:relative;max-width:470px;width:100%;text-align:center;padding:34px 28px;border-radius:22px;
  background:linear-gradient(180deg,rgba(34,46,88,.97),rgba(14,20,46,.97));border:1px solid var(--gold-dim);
  box-shadow:0 30px 70px rgba(0,0,0,.75), 0 0 70px rgba(242,203,107,.20)}
.cel.on .cel-card{animation:popIn .75s cubic-bezier(.2,1.5,.4,1) both}
.cel-badge{width:92px;margin:0 auto 14px}
.cel-eyebrow{font-family:"Cinzel",serif;color:var(--gold-dim);letter-spacing:.2em;font-size:12px;margin:0 0 8px}
.cel-title{font-size:25px;color:var(--gold);margin:0 0 12px}
.cel-msg{color:var(--ink);font-size:16.5px;margin:0 0 6px;line-height:1.8}
.cel-sub{color:var(--muted);font-size:15px;margin:10px 0 0}
.cel-pts{display:inline-block;margin:16px 0 20px;padding:9px 20px;border-radius:999px;
  border:1px solid var(--gold-dim);background:rgba(242,203,107,.14);color:var(--gold);
  font-family:"Cinzel",serif;font-size:15px;letter-spacing:.06em}
.conf{position:absolute;top:-26px;width:9px;height:15px;border-radius:2px;opacity:.95;
  animation:confFall var(--d) linear forwards}
@keyframes confFall{to{transform:translateY(112vh) rotate(760deg);opacity:.1}}

/* ───────── 최종 연출 ───────── */
.finale{position:fixed;inset:0;z-index:80;background:#0A0E1E;overflow:hidden;
  opacity:0;pointer-events:none;transition:opacity .8s ease}
.finale.on{opacity:1;pointer-events:auto}
.fx{position:absolute;inset:0}
#fxSky{opacity:0;transition:opacity 1.4s ease}
#fxSolar{opacity:0;transition:opacity 1.6s ease;display:flex;align-items:center;justify-content:center}
.twinkle{position:absolute;border-radius:50%;background:#FFF6DE;opacity:0;
  animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.consgroup{position:absolute;opacity:0;transition:opacity .9s ease}
.consgroup.draw{opacity:1}
.consgroup polyline{stroke:#C9D4F5;stroke-width:.02;fill:none;opacity:.75;
  stroke-dasharray:1;stroke-dashoffset:1}
.consgroup.draw polyline{animation:drawLine 1.8s ease-out forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
.consgroup circle{fill:#FFF6DE}
.consgroup text{fill:#8E9AC4;font-size:.09px;font-family:"Gowun Batang",serif}
.sun{position:absolute;left:50%;top:50%;width:9vmin;height:9vmin;margin:-4.5vmin 0 0 -4.5vmin;
  border-radius:50%;background:radial-gradient(circle at 42% 38%,#FFF3C4,#F0A62A 55%,#C9701A);
  box-shadow:0 0 12vmin rgba(240,166,42,.55);animation:sunPulse 4s ease-in-out infinite}
@keyframes sunPulse{0%,100%{box-shadow:0 0 10vmin rgba(240,166,42,.45)}50%{box-shadow:0 0 16vmin rgba(240,166,42,.72)}}
.orbit{position:absolute;left:50%;top:50%;width:calc(var(--r)*2);height:calc(var(--r)*2);
  margin-left:calc(var(--r)*-1);margin-top:calc(var(--r)*-1);
  border:1px solid rgba(190,205,255,.11);border-radius:50%;
  animation:spin var(--t) linear infinite}
.pl{position:absolute;left:50%;top:0;width:var(--sz);height:var(--sz);
  margin-left:calc(var(--sz)*-0.5);margin-top:calc(var(--sz)*-0.5);border-radius:50%;
  background:var(--c);box-shadow:0 0 calc(var(--sz)*0.7) rgba(255,255,255,.3);
  animation:spin var(--t) linear infinite reverse}
.pl b{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);
  font-family:"Gowun Batang",serif;font-size:11px;font-weight:400;color:#93A0C8;white-space:nowrap;
  opacity:0;transition:opacity .8s ease}
.fx-labels .pl b{opacity:1}
.ring-sat{position:absolute;left:50%;top:50%;width:calc(var(--sz)*2);height:calc(var(--sz)*0.62);
  margin-left:calc(var(--sz)*-1);margin-top:calc(var(--sz)*-0.31);
  border:1.5px solid rgba(226,198,140,.75);border-radius:50%;transform:rotate(-18deg)}
.earthface{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  animation:spin 4.5s linear infinite}
.earthface i{position:absolute;display:block;background:#4E9A5E;border-radius:45%}
.moonorbit{position:absolute;left:50%;top:50%;width:calc(var(--sz)*2.6);height:calc(var(--sz)*2.6);
  margin-left:calc(var(--sz)*-1.3);margin-top:calc(var(--sz)*-1.3);
  border:1px solid rgba(255,255,255,.14);border-radius:50%;animation:spin 5.5s linear infinite}
.moonorbit span{position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;
  border-radius:50%;background:#E9E4D2;box-shadow:0 0 8px rgba(255,255,255,.5)}
.shoot{position:absolute;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#FFF8E0);
  animation:shootFly var(--d) ease-in forwards}
@keyframes shootFly{0%{transform:translate(0,0) rotate(24deg) scaleX(.2);opacity:0}
  12%{opacity:1}100%{transform:translate(78vw,34vh) rotate(24deg) scaleX(1);opacity:0}}
.fx-caption{position:absolute;left:0;right:0;bottom:13%;text-align:center;padding:0 26px;
  font-size:22px;line-height:1.7;color:#FFF7E4;opacity:0;transition:opacity .7s ease;
  text-shadow:0 2px 22px rgba(0,0,0,.95)}
.fx-skip{position:absolute;top:18px;right:18px;z-index:5;padding:8px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.35);color:#C6CBDC;
  font-family:"Cinzel",serif;font-size:12px;letter-spacing:.1em}
.fx-skip:hover{border-color:var(--gold-dim);color:var(--gold)}

/* 불꽃놀이 */
.shell{position:absolute;width:5px;height:5px;border-radius:50%;background:currentColor;
  box-shadow:0 0 12px currentColor;animation:shellUp var(--d) cubic-bezier(.2,.62,.5,1) forwards}
@keyframes shellUp{0%{transform:translateY(0) scale(.5);opacity:.25}
  22%{opacity:1}100%{transform:translateY(var(--rise)) scale(1);opacity:.95}}
.fp{position:absolute;border-radius:50%;background:currentColor;
  box-shadow:0 0 12px currentColor;animation:fpFly var(--d) cubic-bezier(.12,.62,.3,1) forwards}
@keyframes fpFly{0%{transform:translate(0,0) scale(1);opacity:1}
  60%{opacity:1}
  100%{transform:translate(var(--tx), calc(var(--ty) + 76px)) scale(.3);opacity:0}}
.fw-flash{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.92), rgba(255,255,255,0) 62%);
  animation:fwFlash .55s ease-out forwards}
@keyframes fwFlash{0%{opacity:0;transform:scale(.18)}24%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
/* 바람 */
.wind{position:absolute;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,244,214,0),rgba(255,244,214,.85),rgba(255,244,214,0));
  animation:windBlow var(--d) linear forwards}
@keyframes windBlow{0%{transform:translateX(0);opacity:0}16%{opacity:.9}100%{transform:translateX(-122vw);opacity:0}}
.wfleck{position:absolute;width:7px;height:10px;border-radius:2px;
  animation:fleckBlow var(--d) linear forwards}
@keyframes fleckBlow{0%{transform:translate(0,0) rotate(0deg);opacity:0}
  12%{opacity:1}
  100%{transform:translate(-120vw, var(--dy)) rotate(-680deg);opacity:0}}
/* 인증서가 바람에 실려 들어온다 */
#fxCert.show .cert{animation:certWind 1.35s cubic-bezier(.16,.9,.28,1) both}
@keyframes certWind{
  0%{opacity:0;transform:translate(118vw, 28vh) rotate(36deg) scale(.5);filter:blur(9px)}
  42%{opacity:1;filter:blur(3px)}
  70%{transform:translate(-3vw,-1.5vh) rotate(-6deg) scale(1.05);filter:blur(0)}
  86%{transform:translate(1vw,.6vh) rotate(2.5deg) scale(.985)}
  100%{transform:none;opacity:1;filter:blur(0)}}

/* ───────── 인증상장 ───────── */
#fxCert{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:26px 18px;overflow-y:auto;z-index:4}
#fxCert.show .cert{animation:popIn .9s cubic-bezier(.2,1.4,.4,1) both}
.cert{position:relative;width:100%;max-width:560px;border-radius:20px;padding:8px;
  background:linear-gradient(150deg,var(--hc),#2A1F18 42%,#2A1F18 60%,var(--hc));
  box-shadow:0 30px 80px rgba(0,0,0,.7)}
.cert-in{border-radius:14px;padding:34px 30px 28px;text-align:center;
  background:linear-gradient(180deg,#F3E7CB,#E6D5B0);color:#3A2A1E;
  border:1px solid rgba(58,42,30,.25)}
.cert-crest{width:76px;margin:0 auto 12px}
.cert-eyebrow{font-family:"Cinzel",serif;font-size:11.5px;letter-spacing:.26em;color:#8A6A12;margin:0 0 6px}
.cert-title{font-size:27px;margin:0 0 4px;color:#3A2A1E}
.cert-rule{width:66px;height:2px;background:var(--hc);margin:14px auto 18px;border-radius:2px}
.cert-name{font-size:31px;margin:0 0 4px;color:#2E211A;letter-spacing:.02em}
.cert-house{font-family:"Cinzel",serif;font-size:14px;letter-spacing:.14em;color:var(--hc);margin:0 0 18px}
.cert-body{font-size:16px;line-height:1.95;margin:0 auto 18px;max-width:430px;color:#4A382A}
.cert-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 16px}
.cert-stat{min-width:104px;padding:11px 14px;border-radius:11px;background:rgba(58,42,30,.07);
  border:1px solid rgba(58,42,30,.16)}
.cert-stat b{display:block;font-size:21px;color:#3A2A1E;line-height:1.3}
.cert-stat span{font-size:11.5px;letter-spacing:.1em;color:#7C6650;font-family:"Cinzel",serif}
.cert-note{font-size:14.5px;line-height:1.85;color:#5A4634;background:rgba(58,42,30,.06);
  border-left:3px solid var(--hc);border-radius:0 9px 9px 0;padding:12px 15px;text-align:left;margin:0 0 20px}
.cert-sign{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;
  border-top:1px solid rgba(58,42,30,.2);padding-top:14px;font-size:13.5px;color:#6B5540}
.cert-sign b{display:block;font-size:15px;color:#3A2A1E;font-weight:700}
.fx-actions{position:absolute;left:0;right:0;bottom:22px;z-index:6;display:flex;gap:10px;
  justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity .6s ease;pointer-events:none}
.fx-actions.show{opacity:1;pointer-events:auto}
.fx-actions .btn{width:auto;padding:13px 24px;font-size:14px}

@media (max-width:640px){
  .fx-caption{font-size:17px;bottom:11%}
  .cert-in{padding:26px 18px 22px}
  .cert-name{font-size:25px}
  .cert-title{font-size:22px}
  #fxCert{align-items:flex-start;padding-top:60px;padding-bottom:110px}
}
@media print{
  body *{visibility:hidden !important}
  #fxCert, #fxCert *{visibility:visible !important}
  .finale{position:absolute !important;inset:auto !important;opacity:1 !important;background:#fff !important}
  #fxCert{position:static !important;padding:0 !important;overflow:visible !important}
  .cert{box-shadow:none !important;max-width:100% !important;background:#fff !important;padding:0 !important}
  .cert-in{border:2px solid var(--hc) !important;background:#fff !important}
  .fx-skip,.fx-actions{display:none !important}
}

@media (max-width:760px){
  body{font-size:16px}
  .grid{grid-template-columns:1fr}
  .title{font-size:30px}
  .candlerow{gap:22px}
  .pair-key{width:100%;text-align:center}
  .pair input{width:100%}
  .prof-btn{position:static;display:block;margin:16px auto 0;width:fit-content}
  .quest-head{flex-direction:column;text-align:center;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="sky" id="sky"></div>
<div class="candlerow" id="candles"></div>

<div class="wrap">
  <button id="profBtn" class="btn-ghost prof-btn">PROFESSOR</button>

  <!-- 1. 등록 -->
  <section id="scLogin" class="narrow center">
    <div class="hero" id="heroArt"></div>
    <h1 class="title deco">천문탑의 밤</h1>
    <p class="subtitle">이름을 남기면 탑으로 오르는 계단이 열립니다</p>
    <div class="card" style="text-align:left">
      <div class="field">
        <label>CLASSROOM · 반</label>
        <input id="inClass" placeholder="예: 6-1" autocomplete="off">
      </div>
      <div class="field">
        <label>FULL NAME · 이름</label>
        <input id="inName" placeholder="예: 김해리" autocomplete="off">
      </div>
    </div>
    <button id="btnEnter" class="btn" style="margin-top:24px" disabled>대연회장으로 들어가기</button>
    <p id="resumeWrap" class="hidden" style="margin:16px 0 0">
      <button class="btn-ghost" id="btnResume"></button>
    </p>
  </section>

  <!-- 2. 분류 -->
  <section id="scSort" class="narrow center hidden">
    <div class="hatwrap" id="hatArt"></div>
    <h1 class="title deco" style="font-size:34px">분류 모자</h1>
    <p class="subtitle" id="sortWelcome"></p>
    <p class="murmur" id="murmur"></p>
    <div id="sortResult" class="hidden">
      <div class="reveal-crest" id="revealCrest"></div>
      <div class="house-en" id="revealEn"></div>
      <div class="house-ko" id="revealKo"></div>
    </div>
    <button id="btnSort" class="btn">모자 쓰기</button>
  </section>

  <!-- 3. 대시보드 -->
  <section id="scDash" class="hidden">
    <div class="hud">
      <div class="hud-left">
        <div class="hud-crest" id="hudCrest"></div>
        <div>
          <div class="hud-name" id="hudName"></div>
          <div class="hud-house en" id="hudHouse"></div>
          <div class="hud-pts" id="hudPts"></div>
          <button class="btn-ghost" id="btnExit" style="margin-top:7px;padding:5px 13px;font-size:11px">다른 학생으로</button>
        </div>
      </div>
      <div class="glasses" id="glasses"></div>
    </div>
    <div id="finBanner"></div>
    <div class="grid" id="questGrid"></div>
  </section>

  <!-- 4. 과제 -->
  <section id="scQuest" class="hidden">
    <button class="btn-ghost" id="btnBack" style="margin-top:22px">← 과제 목록</button>
    <div class="quest-head">
      <div class="q-ico" id="qIco"></div>
      <div>
        <h2 id="qTitle"></h2>
        <p id="qDesc"></p>
      </div>
    </div>
    <div id="qFeedback"></div>
    <div id="qBody"></div>
    <button id="btnSubmit" class="btn" style="margin-top:6px">답 제출하기</button>
    <div class="row hidden" id="qAfter">
      <button id="btnRetry" class="btn sub">다시 풀기</button>
      <button id="btnNext" class="btn">과제 목록으로</button>
    </div>
  </section>

  <!-- 5. 교사용 -->
  <section id="scProf" class="hidden">
    <button class="btn-ghost" id="btnProfBack" style="margin-top:22px">← 돌아가기</button>
    <div class="quest-head">
      <div class="q-ico" id="profIco"></div>
      <div>
        <h2>교수 연구실</h2>
        <p>학생별 진행 상황과 기숙사 점수</p>
      </div>
    </div>
    <div id="profLock" class="card narrow">
      <div class="field">
        <label>PASSWORD · 교사 암호</label>
        <input id="inPw" type="password" placeholder="암호를 입력하세요">
      </div>
      <button id="btnPw" class="btn" style="margin-top:16px">열기</button>
      <p id="pwErr" class="hidden" style="color:#E38A72;margin:14px 0 0;font-size:15px">암호가 맞지 않습니다. 다시 입력해 주세요.</p>
    </div>
    <div id="profPanel" class="hidden">
      <div class="card" style="margin-bottom:18px">
        <h3 style="margin-bottom:10px;color:var(--gold)">기숙사 점수</h3>
        <div id="profHouses"></div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:4px;color:var(--gold)">학생 현황</h3>
        <div id="profTable"></div>
        <div class="row" style="margin-top:20px">
          <button id="btnCsv" class="btn sub">엑셀(CSV)로 내려받기</button>
          <button id="btnReset" class="btn danger">기록 모두 지우기</button>
        </div>
      </div>
    </div>
  </section>

</div>

<div class="flash" id="flash"></div>
<div class="dust" id="dust"></div>

<!-- 단계 축하 -->
<div class="cel" id="cel">
  <div class="cel-card">
    <div class="cel-badge" id="celBadge"></div>
    <p class="cel-eyebrow" id="celEyebrow"></p>
    <h3 class="cel-title" id="celTitle"></h3>
    <p class="cel-msg" id="celMsg"></p>
    <span class="cel-pts" id="celPts"></span>
    <p class="cel-sub" id="celSub"></p>
    <button class="btn" id="celBtn" style="margin-top:20px">계속하기</button>
  </div>
</div>

<!-- 최종 연출 -->
<div class="finale" id="finale">
  <div class="fx" id="fxSky"></div>
  <div class="fx" id="fxSolar"></div>
  <div class="fx" id="fxShoot" style="pointer-events:none"></div>
  <div class="fx" id="fxFire" style="pointer-events:none;z-index:3"></div>
  <div class="fx" id="fxConfetti" style="pointer-events:none"></div>
  <p class="fx-caption" id="fxCaption"></p>
  <div id="fxCert"></div>
  <div class="fx-actions" id="fxActions">
    <button class="btn" id="btnPrintCert">상장 인쇄 · PDF로 저장</button>
    <button class="btn sub" id="btnCloseFinale">닫기</button>
  </div>
  <button class="fx-skip" id="fxSkip">건너뛰기 ›</button>
</div>

<script>
"use strict";
/* ============================================================
   교사 설정 — 이 두 줄만 바꾸면 됩니다
   ============================================================ */
const TEACHER_PASSWORD = "2026";
const PASS_RATE = 0.6;

/* ---------- 저장소 ---------- */
const Store = (() => {
  let mem = {}, ok = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); } catch(e){ ok = false; }
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } },
    del(k){ try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch(e){ delete mem[k]; } }
  };
})();
const DB_KEY = "astro_tower_v2", ME_KEY = "astro_tower_me";
function loadDB(){ try { return JSON.parse(Store.get(DB_KEY)) || {students:{}}; } catch(e){ return {students:{}}; } }
function saveDB(db){ Store.set(DB_KEY, JSON.stringify(db)); }

/* ============================================================
   직접 그린 삽화 (원본 SVG)
   ============================================================ */
const G = "#F2CB6B", GD = "#D9AE4C", CR = "#FFF6DE";

function candleSVG(){
  return '<svg viewBox="0 0 20 50" aria-hidden="true">' +
    '<g class="flame"><ellipse cx="10" cy="11" rx="4" ry="8" fill="#E8A13C" opacity=".85"/>' +
    '<ellipse cx="10" cy="13" rx="2" ry="4.6" fill="#FBE7A8"/></g>' +
    '<rect x="6.5" y="20" width="7" height="26" rx="2" fill="#F2E4C2" stroke="'+GD+'" stroke-width="1"/>' +
    '<rect x="6.5" y="20" width="2.4" height="26" fill="#FFF6E2" opacity=".55"/>' +
    '<path d="M4.5 46h11l-1.6 3.5H6.1z" fill="'+GD+'"/></svg>';
}

/* 성탑 야경 — 로그인 히어로 */
function castleSVG(){
  let stars = "";
  const pts = [[28,26],[64,14],[102,38],[150,20],[196,12],[238,32],[286,18],[330,44],[372,22],[404,52],[46,58],[120,64],[262,60],[352,70],[16,90],[400,96]];
  pts.forEach((p,i) => { const r = i%3===0?1.6:1; stars += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="'+CR+'" opacity="'+(i%3===0?.9:.5)+'"/>'; });
  // 달
  const moon = '<circle cx="372" cy="46" r="24" fill="#F3E2B4" opacity=".95"/>' +
               '<circle cx="362" cy="40" r="22" fill="#1E1511"/>' +
               '<circle cx="378" cy="38" r="2.6" fill="#E0CB9A" opacity=".6"/>' +
               '<circle cx="384" cy="54" r="3.4" fill="#E0CB9A" opacity=".45"/>';
  // 탑 만들기
  function tower(x,w,top,roof){
    const win = [];
    for (let wy = top + 18; wy < 168; wy += 22){
      for (let wx = x + 6; wx < x + w - 8; wx += 14){
        const lit = ((wx+wy) % 3 !== 0);
        win.push('<rect x="'+wx+'" y="'+wy+'" width="6" height="9" rx="2.5" fill="'+(lit?G:"#2A1E18")+'" opacity="'+(lit?.95:1)+'"/>');
      }
    }
    return '<rect x="'+x+'" y="'+top+'" width="'+w+'" height="'+(175-top)+'" fill="#2C2019"/>' +
           '<path d="M'+(x-5)+' '+top+' L'+(x+w/2)+' '+roof+' L'+(x+w+5)+' '+top+' Z" fill="#3B2A20"/>' +

function hashStr(s){ let h = 0; for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))|0; return Math.abs(h); }
function pickHouse(key){
  const db = loadDB(), count = {GRY:0,SLY:0,RAV:0,HUF:0};
  Object.values(db.students).forEach(s => { if (count[s.house] !== undefined) count[s.house]++; });
  const min = Math.min(...HKEYS.map(h => count[h]));
  const pool = HKEYS.filter(h => count[h] === min);
  return pool[hashStr(key) % pool.length];
}

/* ---------- 채점 ---------- */
function norm(s){ return (s||"").replace(/\s/g,"").trim(); }
function gradeOne(q,i){
  const box = document.getElementById("qBody");
  if (q.type === "pairs"){
    const ins = box.querySelectorAll('.a-pair[data-q="'+i+'"]');
    let all = true, wrong = [];
    q.items.forEach((it,j) => {
      const ok = it.answers.some(a => norm(a) === norm(ins[j].value));
      if (!ok){ all = false; wrong.push(it.sub + " → " + it.answers[0]); }
    });
    return { ok:all, msg: all ? null : "행성의 자리: " + wrong.join(", ") };
  }
  if (q.type === "fill"){
    const v = norm(box.querySelector('.a-fill[data-q="'+i+'"]').value);
    const ok = q.answers.some(a => norm(a) === v);
    return { ok, msg: ok ? null : q.why };
  }
  if (q.type === "choice"){
    const ok = answers[i] === q.answer;
    return { ok, msg: ok ? null : "정답: " + q.options[q.answer] + " — " + q.why };
  }
  if (q.type === "multi"){
    const a = (answers[i]||[]).slice().sort().join(",");
    const ok = a !== "" && a === q.answer.slice().sort().join(",");
    return { ok, msg: ok ? null : "틀린 문장은 " + q.answer.map(n=>n+1).join("번, ") + "번입니다. " + q.why };
  }
  if (q.type === "order"){
    const ok = (answers[i]||[]).join(",") === q.answer.join(",");
    return { ok, msg: ok ? null : q.why };
  }
  if (q.type === "essay"){
    const v = norm(box.querySelector('.a-essay[data-q="'+i+'"]').value);
    const ok = v.length >= 8 && q.keywords.every(g => g.some(k => v.includes(k)));
    return { ok, msg: ok ? null : "이렇게 쓸 수 있어요 — " + q.model };
  }
  return { ok:false, msg:null };
}

function rainConfetti(host, colors, n, spread){
  if (REDUCED) return;
  for (let i = 0; i < n; i++){
    const c = document.createElement("span");
    c.className = "conf";
    c.style.left = (Math.random() * 100).toFixed(1) + "%";
    c.style.background = colors[i % colors.length];
    c.style.setProperty("--d", (2200 + Math.random() * (spread || 1800)).toFixed(0) + "ms");
    c.style.animationDelay = (Math.random() * (spread || 1400)).toFixed(0) + "ms";
    c.style.transform = "rotate(" + (Math.random() * 360).toFixed(0) + "deg)";
    host.appendChild(c);
    setTimeout(() => c.remove(), 5200);
  }
}

/* 받침 유무에 따라 이/가 를 고른다 */
function josaIga(w){
  const c = w.charCodeAt(w.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return "이";
  return ((c - 0xAC00) % 28) ? "이" : "가";
}

    pts:[[0,.42],[.17,.30],[.35,.22],[.52,.30],[.70,.26],[.88,.46],[.72,.62]],

];
function buildSky(){
  const sky = document.getElementById("fxSky");
  sky.innerHTML = "";
  for (let i = 0; i < 140; i++){
    const st = document.createElement("span");
    st.className = "twinkle";
    const sz = (1 + Math.random() * 2.4).toFixed(1) + "px";
    st.style.width = sz; st.style.height = sz;
    st.style.left = (Math.random() * 100).toFixed(2) + "%";
    st.style.top = (Math.random() * 100).toFixed(2) + "%";
    st.style.animationDelay = (-Math.random() * 3.6).toFixed(2) + "s";
    sky.appendChild(st);
  }
  CONSTS.forEach((c, i) => {
    const g = document.createElement("div");
    g.className = "consgroup"; g.dataset.i = i;
    g.style.left = c.left; g.style.top = c.top; g.style.width = c.w;
    let inner = '<svg viewBox="0 0 1 1" style="width:100%;height:auto;overflow:visible">';
    c.lines.forEach(seq => {
      inner += '<polyline vector-effect="non-scaling-stroke" style="stroke-width:1.3" points="' +
        seq.map(k => c.pts[k][0] + "," + c.pts[k][1]).join(" ") + '"/>';
    });
    c.pts.forEach(pt => { inner += '<circle cx="' + pt[0] + '" cy="' + pt[1] + '" r="0.016"/>'; });
    inner += "</svg>";
    inner += '<b style="display:block;text-align:center;color:#8E9AC4;font-size:12.5px;' +
             'margin-top:6px;letter-spacing:.08em">' + c.n + "</b>";
    g.innerHTML = inner;
    document.getElementById("fxSky").appendChild(g);
  });
}

/* ---------- 태양계 ---------- */
const PLANETS = [
  {n:"수성",   r:11,   sz:9,  c:"#B9A48C", t:6},
  {n:"금성",   r:15.5, sz:13, c:"#E4C07A", t:9},
  {n:"지구",   r:21,   sz:22, c:"#3E6FB5", t:13, earth:true},
  {n:"화성",   r:26.5, sz:12, c:"#C1613C", t:18},
  {n:"목성",   r:33,   sz:30, c:"#D6A97A", t:26},
  {n:"토성",   r:39.5, sz:25, c:"#E0C68C", t:34, ring:true},
  {n:"천왕성", r:44.5, sz:18, c:"#8FC7CE", t:42},
  {n:"해왕성", r:48.5, sz:17, c:"#5C7BD1", t:50}
];
function buildSolar(){
  const box = document.getElementById("fxSolar");
  let html = '<div class="sun"></div>';
  PLANETS.forEach(p => {
    let inner = "";
    if (p.earth){
      inner += '<span class="earthface">' +
        '<i style="left:10%;top:20%;width:48%;height:30%"></i>' +
        '<i style="left:50%;top:54%;width:40%;height:28%"></i>' +
        '<i style="left:4%;top:60%;width:28%;height:22%"></i></span>' +
        '<div class="moonorbit"><span></span></div>';
    }
    if (p.ring) inner += '<span class="ring-sat"></span>';
    inner += "<b>" + p.n + "</b>";
    html += '<div class="orbit" style="--r:' + p.r + 'vmin;--t:' + p.t + 's">' +
            '<div class="pl" style="--sz:' + p.sz + 'px;--c:' + p.c + ';--t:' + p.t + 's">' +
            inner + "</div></div>";
  });
  box.innerHTML = html;
}

/* ---------- 수료 인증상장 ---------- */
const HOUSE_PRAISE = {
  GRY:"어려운 문항 앞에서 먼저 손을 든 용기",
  SLY:"한 번 틀려도 끝까지 놓지 않은 끈기",

};
function certHTML(){
  const h = HOUSES[me.house], t = houseTotals(), mine = myTotal();
  const ranked = HKEYS.slice().sort((a,b) => t[b] - t[a]);
  const rank = ranked.indexOf(me.house) + 1;
  const d = new Date();
  const ds = d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일";
  const share = t[me.house] > 0 ? Math.round(mine / t[me.house] * 100) : 100;
  const note = mine + "점은 모두 " + h.ko + "의 점수가 되었습니다. " +
    h.ko + "는 지금 " + t[me.house] + "점으로 네 기숙사 가운데 " + rank + "위이며, " +
    "그중 " + share + "%가 " + me.name + " 학생이 쌓은 몫입니다.";
  return '<div class="cert" style="--hc:' + h.color + '"><div class="cert-in">' +
    '<div class="cert-crest">' + crestSVG(me.house) + "</div>" +
    '<p class="cert-eyebrow">CERTIFICATE OF ASTRONOMY</p>' +
    '<h2 class="cert-title">천문학 수료 인증서</h2>' +
    '<div class="cert-rule"></div>' +
    '<p class="cert-name">' + me.cls + " " + me.name + "</p>" +
    '<p class="cert-house">' + h.en + " · " + h.ko + "</p>" +
    '<p class="cert-body">위 학생은 천문탑의 네 관문을 모두 통과하여<br>' +
    '태양계의 짜임과 지구의 자전과 공전, 달의 위치와 모양 변화를<br>' +
    '스스로 설명할 수 있게 되었음을 인증합니다.</p>' +
    '<div class="cert-stats">' +
      '<div class="cert-stat"><b>' + mine + '점</b><span>내 점수</span></div>' +
      '<div class="cert-stat"><b>4 / 4</b><span>관문</span></div>' +
      '<div class="cert-stat"><b>' + rank + '위</b><span>기숙사 순위</span></div>' +
    "</div>" +
    '<p class="cert-note">' + note + "<br>무엇보다 " + HOUSE_PRAISE[me.house] + "이(가) 이 점수를 만들었습니다.</p>" +
    '<div class="cert-sign"><span>' + ds + "</span>" +
    "<span><b>천문탑 천문학 교수</b>호그와트 마법학교</span></div>" +
    "</div></div>";
}

/* ---------- 불꽃놀이 ---------- */
const FW_COLORS = ["#FFD35C","#FF7A59","#7FD4FF","#C79BFF","#8CF2A8","#FF9ED2","#FFF3C8"];
function firework(xPct, yPct, color, count){
  if (REDUCED) return;
  const host = document.getElementById("fxFire");
  const col = color || FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
  const sh = document.createElement("span");
  sh.className = "shell"; sh.style.color = col;
  sh.style.left = xPct + "%"; sh.style.top = "94%";
  sh.style.setProperty("--rise", -(94 - yPct) + "vh");
  sh.style.setProperty("--d", "720ms");
  host.appendChild(sh);
  setTimeout(() => {
    sh.remove();
    const fl = document.createElement("span");
    fl.className = "fw-flash";
    fl.style.left = xPct + "%"; fl.style.top = yPct + "%";
    host.appendChild(fl); setTimeout(() => fl.remove(), 650);
    const n = count || 30;
    for (let i = 0; i < n; i++){
      const a = Math.PI * 2 * i / n + Math.random() * 0.22;
      const r = 90 + Math.random() * 140;
      const fp = document.createElement("span");
      fp.className = "fp"; fp.style.color = col;
      const sz = (3 + Math.random() * 4).toFixed(1) + "px";
      fp.style.width = sz; fp.style.height = sz;
      fp.style.left = xPct + "%"; fp.style.top = yPct + "%";
      fp.style.setProperty("--tx", (Math.cos(a) * r).toFixed(0) + "px");
      fp.style.setProperty("--ty", (Math.sin(a) * r).toFixed(0) + "px");
      fp.style.setProperty("--d", (1100 + Math.random() * 800).toFixed(0) + "ms");
      host.appendChild(fp);
      setTimeout(() => fp.remove(), 2300);
    }
  }, 720);
}
function volley(n, color){
  for (let i = 0; i < n; i++)
    setTimeout(() => firework(11 + Math.random() * 78, 15 + Math.random() * 32, color), i * 190);
}

    f.style.top = (4 + Math.random() * 86).toFixed(0) + "%";
    f.style.background = cols[i % 3];
    f.style.setProperty("--dy", ((Math.random() * 2 - 1) * 20).toFixed(0) + "vh");
    f.style.setProperty("--d", (1000 + Math.random() * 720).toFixed(0) + "ms");
    f.style.animationDelay = (Math.random() * 520).toFixed(0) + "ms";
    host.appendChild(f); setTimeout(() => f.remove(), 2700);
  }
}

/* ---------- 최종 연출 ---------- */
let fxTimers = [];
function fxAt(ms, fn){ fxTimers.push(setTimeout(fn, ms)); }
function fxClear(){ fxTimers.forEach(clearTimeout); fxTimers = []; }
function fxCap(text){
  const el = document.getElementById("fxCaption");
  el.style.opacity = "0";
  fxAt(450, () => { el.innerHTML = text; el.style.opacity = "1"; });
}
function fxShootingStars(n){
  if (REDUCED) return;
  const host = document.getElementById("fxShoot");
  for (let i = 0; i < n; i++){
    const sh = document.createElement("span");
    sh.className = "shoot";
    sh.style.width = (120 + Math.random() * 120).toFixed(0) + "px";
    sh.style.left = (-10 + Math.random() * 25).toFixed(0) + "%";
    sh.style.top = (6 + Math.random() * 40).toFixed(0) + "%";
    sh.style.setProperty("--d", (900 + Math.random() * 700).toFixed(0) + "ms");
    sh.style.animationDelay = (i * 260) + "ms";
    host.appendChild(sh);
    setTimeout(() => sh.remove(), 2600);
  }
}
function fxFlash(){
  if (REDUCED) return;
  const f = document.createElement("div");
  f.className = "flash go";
  f.style.position = "absolute"; f.style.zIndex = "5";
  document.getElementById("finale").appendChild(f);
  setTimeout(() => f.remove(), 1100);
}
function fxShowCert(){
  const cert = document.getElementById("fxCert");
  cert.innerHTML = certHTML();
  cert.classList.add("show");
  document.getElementById("fxSolar").style.opacity = REDUCED ? "0" : ".22";
  document.getElementById("fxSky").style.opacity = REDUCED ? "0" : ".35";
  document.getElementById("fxCaption").style.opacity = "0";
}

function runFinale(){
  fxClear();
  const fin = document.getElementById("finale");
  const sky = document.getElementById("fxSky"), sol = document.getElementById("fxSolar");
  const cert = document.getElementById("fxCert");

  buildSky(); buildSolar();
  document.getElementById("fxFire").innerHTML = "";
  document.getElementById("fxConfetti").innerHTML = "";
  cert.innerHTML = ""; cert.classList.remove("show");
  document.getElementById("fxActions").classList.remove("show");
  document.getElementById("fxCaption").innerHTML = "";
  document.getElementById("fxCaption").style.opacity = "0";
  sky.style.opacity = "0"; sol.style.opacity = "0";
  sol.classList.remove("fx-labels");
  fin.classList.add("on");

  if (REDUCED){ fxShowCert(); document.getElementById("fxActions").classList.add("show"); return; }

  fxAt(200,   () => { sky.style.opacity = "1"; });
  fxAt(900,   () => fxCap("천문탑의 마지막 관문을 지났습니다."));
  fxAt(2200,  () => { document.querySelector('.consgroup[data-i="0"]').classList.add("draw"); });
  fxAt(2900,  () => { document.querySelector('.consgroup[data-i="1"]').classList.add("draw"); });
  fxAt(3600,  () => { document.querySelector('.consgroup[data-i="2"]').classList.add("draw"); });
  fxAt(3300,  () => fxCap("계절이 바뀌면 왜 다른 별자리가 뜨는지,<br>이제 설명할 수 있습니다."));
  fxAt(5600,  () => { sky.style.opacity = ".3"; sol.style.opacity = "1"; });
  fxAt(6300,  () => fxCap("지구는 스스로 돌며 낮과 밤을 만들고,"));
  fxAt(7000,  () => sol.classList.add("fx-labels"));
  fxAt(8000,  () => fxCap("태양 둘레를 한 해에 한 바퀴 돕니다."));
  fxAt(9700,  () => fxCap("달은 지구 곁을 돌며<br>날마다 모습을 바꿉니다."));
  fxAt(11300, () => { fxShootingStars(4); fxCap("당신은 그 모든 움직임을 읽어냈습니다."); });
  /* 폭죽이 하나씩 오르다가 마지막에 한꺼번에 터진다 */
  fxAt(12000, () => firework(24, 24));
  fxAt(12500, () => firework(72, 20));
  fxAt(13000, () => volley(4));
  fxAt(13900, () => fxCap("축하합니다!"));
  fxAt(14000, () => volley(7));
  fxAt(14600, () => {
    fxFlash();
    firework(50, 22, HOUSES[me.house].color, 44);
    rainConfetti(document.getElementById("fxConfetti"),
      [HOUSES[me.house].color, "#D6A53A", "#F0E2C9", "#8FC7CE", "#FF9ED2"], 110, 3000);
  });
  fxAt(15300, windGust);
  fxAt(15800, fxShowCert);
  fxAt(17200, () => document.getElementById("fxActions").classList.add("show"));
}
function closeFinale(){
  fxClear();
  document.getElementById("finale").classList.remove("on");
  setTimeout(() => {
    document.getElementById("fxSky").innerHTML = "";
    document.getElementById("fxSolar").innerHTML = "";
    document.getElementById("fxConfetti").innerHTML = "";
    document.getElementById("fxFire").innerHTML = "";
  }, 800);
  renderDash(); show("scDash");
}
document.getElementById("fxSkip").addEventListener("click", () => {
  fxClear(); fxShowCert();
  document.getElementById("fxActions").classList.add("show");
});
document.getElementById("btnCloseFinale").addEventListener("click", closeFinale);
document.getElementById("btnPrintCert").addEventListener("click", () => window.print());
